name: UI Garden Code Quality Checks

on:
  push:
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Check ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm run test:ci

      - name: Build production application
        run: npm run build